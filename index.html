<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Online PDF Editor</title><meta name="description" content="Free online PDF editor. Open PDF, draw, add text, highlight, whiteout and download. Files stay in your browser."><meta name="robots" content="index,follow"><link rel="canonical" href="https://onlinepdfeditor.devs.surf/"><style>
*{box-sizing:border-box}body{margin:0;background:#eef1f6;color:#202938;font:15px system-ui,Arial}header{background:#fff;padding:14px 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center;box-shadow:0 1px 5px #0002;position:sticky;top:0;z-index:2}h1{font-size:20px;margin:0 auto 0 0}button,.pick,select,input{font:inherit;border:1px solid #cbd3df;border-radius:8px;padding:8px 11px;background:#fff;color:#202938}button,.pick{cursor:pointer}button.active,.primary{background:#2868df;color:white;border-color:#2868df}main{max-width:1050px;margin:24px auto;padding:0 14px}#welcome{text-align:center;background:white;border:2px dashed #b8c5d8;border-radius:16px;padding:48px 18px}#pages{display:grid;gap:22px;justify-content:center}.page{position:relative;background:#fff;box-shadow:0 3px 14px #0002;max-width:100%;overflow:hidden}.page canvas{display:block;max-width:100%;height:auto;touch-action:none}.hint{color:#667085;font-size:13px}footer{text-align:center;padding:25px;color:#667085}
</style></head><body>
<header><h1>📄 Free Online PDF Editor</h1><label class="pick primary">Open PDF <input id="file" type="file" accept="application/pdf" hidden></label><button data-tool="draw" class="active">Draw</button><button data-tool="text">Add Text</button><button data-tool="highlight">Highlight</button><button data-tool="white">Whiteout</button><input id="color" type="color" value="#e53935" title="Color"><button id="undo">Undo</button><button id="download" class="primary">Download PDF</button></header>
<main><section id="welcome"><h2>अपनी PDF यहाँ खोलें</h2><p>Open PDF दबाएँ या PDF फाइल चुनें। फिर Draw, Text, Highlight या Whiteout टूल इस्तेमाल करें।</p><p class="hint">आपकी PDF आपके ब्राउज़र में ही प्रोसेस होती है; सर्वर पर अपलोड नहीं होती।</p></section><div id="pages"></div></main><footer>Free Online PDF Editor · Files stay on your device</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s);let source=null,pdf=null,tool='draw',color='#e53935',history=[];
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
$('#color').oninput=e=>color=e.target.value;
$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;source=await f.arrayBuffer();pdf=await pdfjsLib.getDocument({data:source.slice(0)}).promise;$('#welcome').hidden=true;$('#pages').innerHTML='';history=[];for(let n=1;n<=pdf.numPages;n++)await renderPage(n)};
async function renderPage(n){const p=await pdf.getPage(n),v=p.getViewport({scale:1.35}),wrap=document.createElement('div');wrap.className='page';const c=document.createElement('canvas');c.width=v.width;c.height=v.height;wrap.append(c);$('#pages').append(wrap);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;const ctx=c.getContext('2d');let start=null,active=false;
c.onpointerdown=e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;start={x,y};active=true;c.setPointerCapture(e.pointerId);if(tool==='text'){const t=prompt('अपना टेक्स्ट लिखें');if(t){history.push({n,data:c.toDataURL()});ctx.fillStyle=color;ctx.font='24px Arial';ctx.fillText(t,x,y)}active=false}};
c.onpointerup=e=>{if(!active||!start)return;active=false;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;history.push({n,data:null});ctx.save();if(tool==='draw'){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(x,y);ctx.stroke()}else if(tool==='highlight'){ctx.fillStyle=color+'66';ctx.fillRect(start.x,start.y,x-start.x,y-start.y)}else if(tool==='white'){ctx.fillStyle='#fff';ctx.fillRect(start.x,start.y,x-start.x,y-start.y)}ctx.restore();};
c.onpointermove=e=>{if(!active||tool!=='draw')return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)*c.width/r.width,y=(e.clientY-r.top)*c.height/r.height;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.lineTo(x,y);ctx.stroke();start={x,y}};
}
$('#undo').onclick=()=>{const h=history.pop();if(!h){alert('Undo के लिए कुछ नहीं है');return}if(h.data){const img=new Image();img.onload=()=>{const c=$('#pages').children[h.n-1].querySelector('canvas');c.getContext('2d').clearRect(0,0,c.width,c.height);c.getContext('2d').drawImage(img,0,0)};img.src=h.data}else alert('इस बदलाव को Undo करने के लिए PDF दोबारा खोलें।')};
$('#download').onclick=async()=>{if(!pdf){alert('पहले PDF खोलें');return}const out=await PDFLib.PDFDocument.create();for(const el of $('#pages').children){const c=el.querySelector('canvas'),img=await out.embedPng(c.toDataURL('image/png')),page=out.addPage([c.width/1.35,c.height/1.35]);page.drawImage(img,{x:0,y:0,width:c.width/1.35,height:c.height/1.35})}const bytes=await out.save(),blob=new Blob([bytes],{type:'application/pdf'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='edited.pdf';a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
